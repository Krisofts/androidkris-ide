name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ steps.apk.outputs.sha }}
          name: "Debug build ${{ steps.apk.outputs.sha }}"
          body: "Automated debug build from `${{ github.ref_name }}` @ ${{ steps.apk.outputs.sha }}."
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
